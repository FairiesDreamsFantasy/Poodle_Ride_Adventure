name: Build & Deploy Poodle Ride Adventure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🚀 Publish Build Output to Main Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Prepare deployment configuration in build folder
          cd Poodle_Ride_Adventure_Build
          
          # Ensure .htaccess is included
          if [ -f ../public/.htaccess ]; then
            cp ../public/.htaccess .
          fi

          # Copy deployment scripts so cPanel tasks can execute them
          mkdir -p scripts
          cp -rf ../scripts/. scripts/

          # Create cpanel yml config
          cat <<EOF > .cpanel.yml
---
deployment:
  tasks:
    - "DEPLOYPATH=/home/fairiesd/public_html/Arcade/Poodle_Ride_Adventure /bin/bash scripts/deploy_cpanel.sh"
EOF

          # Initialize a fresh git repo from the build output
          git init
          git checkout -b main
          git add -A
          git commit -m "Production build release ${{ github.sha }}"
          
          # Force push the compiled bundle directly to main
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin main --force
