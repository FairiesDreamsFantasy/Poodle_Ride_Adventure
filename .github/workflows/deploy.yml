name: Build & Deploy Poodle Ride Adventure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🤐 Zip Production Bundle
        run: |
          cd Poodle_Ride_Adventure_Build
          zip -r ../Poodle_Ride_Adventure_Production_Build.zip .
          cd ..

      - name: 📤 Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poodle_Ride_Adventure_Production_Build
          path: Poodle_Ride_Adventure_Production_Build.zip
          retention-days: 30

      - name: 🚀 Push Production Bundle to dist-deploy Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          cd Poodle_Ride_Adventure_Build
          git init
          git checkout -b dist-deploy
          
          printf "%s\n" \
            "---" \
            "deployment:" \
            "  tasks:" \
            "    - export DEPLOYPATH=/home/fairiesd/public_html/Arcade/Poodle_Ride_Adventure" \
            "    - /bin/mkdir -p \$DEPLOYPATH" \
            "    - /bin/cp -rf index.html Assets \$DEPLOYPATH/" > .cpanel.yml

          git add .
          git commit -m "Automated production build for commit ${{ github.sha }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin dist-deploy

      - name: 📡 FTP Deploy to cPanel (Optional)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/Arcade/Poodle_Ride_Adventure/
          local-dir: ./Poodle_Ride_Adventure_Build/
