name: Build & Deploy Poodle Ride Adventure

on:
  push:
    branches:
      - main
      - StableFallback
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Typecheck Source Code
        run: npm run lint

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🚀 Commit & Publish Build Output to Triggering Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure .htaccess and sw.js are included in build directory
          if [ -f public/.htaccess ]; then
            cp -f public/.htaccess Poodle_Ride_Adventure_Build/
          fi
          if [ -f public/sw.js ]; then
            cp -f public/sw.js Poodle_Ride_Adventure_Build/
          fi

          # Stage compiled build output (including deletions) and cPanel deployment scripts
          git add -A -f Poodle_Ride_Adventure_Build .cpanel.yml scripts/

          if git diff --cached --quiet; then
            echo "No build output changes to commit."
            exit 0
          fi

          TARGET_BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "${TARGET_BRANCH}"
          if [ "$(git rev-parse "origin/${TARGET_BRANCH}")" != "${GITHUB_SHA}" ]; then
            echo "Remote branch ${TARGET_BRANCH} advanced while building; skipping stale push so the queued run publishes the latest commit."
            exit 0
          fi

          # Commit linearly on top of existing repository history
          git commit -m "Production release build ${{ github.sha }}"

          # Push linearly back to the triggering branch (main or StableFallback)
          git push origin "HEAD:${TARGET_BRANCH}"
