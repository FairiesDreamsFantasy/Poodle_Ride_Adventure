name: Build & Deploy Poodle Ride Adventure

on:
  push:
    branches:
      - main
      - StableFallback
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🚀 Commit & Publish Build Output to Main Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure .htaccess is included in build directory
          if [ -f public/.htaccess ]; then
            cp public/.htaccess Poodle_Ride_Adventure_Build/
          fi

          # Stage compiled build output and cPanel scripts into repository
          git add -f Poodle_Ride_Adventure_Build .cpanel.yml scripts/

          # Commit linearly on top of existing repository history
          git commit -m "Production release build ${{ github.sha }}" || echo "No changes to commit"

          # Push to main linearly to preserve fast-forward ability for cPanel
          git push origin HEAD:main
